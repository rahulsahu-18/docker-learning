name: e-com

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Backend
    ports:
      - 8000:8000
  db:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_PASSWORD: postgress
      POSTGRES_USER: postgres
      POSTGRES_DB: first
    volumes:
      - postgress_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    depends_on:
      - db
    volumes:
      - redis_data:/data

volumes:
 postgress_data:
 redis_data: